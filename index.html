<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#112329" />
    <title>Exam 5 Practice Desk</title>
    <link rel="stylesheet" href="vendor/jsuites/jsuites.css" />
    <link rel="stylesheet" href="vendor/jspreadsheet-ce/jspreadsheet.css" />
    <link rel="stylesheet" href="styles.css?v=folio-overview-1" />
  </head>
  <body>
    <div class="app-shell">
      <aside id="sidebar" class="sidebar">
        <a class="brand" href="#home" aria-label="Exam 5 Practice Desk home">
          <span class="brand-copy"><strong>Exam 5</strong><small>PRACTICE DESK</small></span>
        </a>
        <div class="sidebar-rule"></div>
        <nav class="primary-nav" aria-label="Main navigation">
          <button type="button" data-nav="home">Overview</button>
          <button type="button" data-nav="library">Question library</button>
          <button type="button" data-nav="quiz">Quiz mode</button>
          <button type="button" data-nav="retry">Retry queue <span id="retry-count" class="nav-count">0</span></button>
          <button type="button" data-nav="history">Attempt history</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="source-badge"><span><strong>Past exams</strong><small id="loaded-count"></small></span></div>
          <button id="export-data" class="sidebar-link" type="button">↓ Export backup</button>
          <button id="import-data" class="sidebar-link" type="button">↑ Import backup</button>
          <input id="import-file" type="file" accept="application/json,.json" hidden />
        </div>
      </aside>

      <div class="main-column">
        <header class="topbar">
          <div class="topbar-left">
            <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-controls="sidebar" aria-expanded="true"><span class="sidebar-toggle-icon" aria-hidden="true">←</span><span class="sidebar-toggle-label">Hide sidebar</span></button>
          </div>
        </header>
        <main id="main-content" tabindex="-1"></main>
      </div>
    </div>
    <dialog id="figure-dialog" class="figure-dialog" aria-labelledby="figure-dialog-title">
      <div class="figure-dialog-header"><strong id="figure-dialog-title"></strong><button id="figure-dialog-close" type="button" aria-label="Close enlarged graph">×</button></div>
      <div class="figure-dialog-body"><img id="figure-dialog-image" alt="" /></div>
      <div class="figure-dialog-footer"><a id="figure-dialog-full" href="#" target="_blank" rel="noopener">Open image at full resolution ↗</a></div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="chapters.js"></script>
    <script src="question_data/questions.js"></script>
    <script src="question_data/spring2013_questions.js"></script>
    <script src="question_data/fall2013_questions.js"></script>
    <script src="question_data/spring2014_questions.js"></script>
    <script src="question_data/spring2019_questions.js"></script>
    <script src="question_data/fall2018_questions.js"></script>
    <script src="question_data/fall2014_questions.js"></script>
    <script src="question_data/spring2015_questions.js"></script>
    <script src="question_data/fall2015_questions.js"></script>
    <script src="question_data/spring2016_questions.js"></script>
    <script src="question_data/fall2016_questions.js"></script>
    <script src="question_data/spring2017_questions.js"></script>
    <script src="question_data/fall2017_questions.js"></script>
    <script src="question_data/spring2018_questions.js"></script>
    <script src="question_data/spring2018_makeup_questions.js"></script>
    <script src="exams.js"></script>
    <script src="vendor/jsuites/jsuites.js"></script>
    <script src="vendor/jspreadsheet-formula/index.js"></script>
    <script src="vendor/jspreadsheet-ce/index.js"></script>
    <script src="app.js?v=folio-overview-1"></script>
  </body>
</html>
